name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Cache model artifacts
        uses: actions/cache@v4
        with:
          path: api/artifacts
          key: artifacts-${{ hashFiles('api/fetch_artifacts.py') }}
      - name: Download artifacts and smoke-test the API
        working-directory: api
        run: |
          python fetch_artifacts.py
          python - <<'PY'
          from app import app
          client = app.test_client()
          health = client.get("/health")
          assert health.status_code == 200, health.data
          r = client.post("/predict", json={"Crop": "CORN", "State": "IA", "County": "POLK", "Year": 2024})
          assert r.status_code == 200, r.data
          print("prediction:", r.get_json())
          PY
